apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`argocd.giaufer.fr`)
      kind: Rule
      middlewares:
        - name: vpn-only
          namespace: kube-system
        - name: security-headers
          namespace: kube-system
      services:
        - name: argocd-server
          port: 80
  tls:
    secretName: argocd-tls
