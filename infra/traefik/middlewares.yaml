apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: vpn-only
  namespace: kube-system
spec:
  ipAllowList:
    sourceRange:
      - 10.8.0.0/24
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: kube-system
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true
    frameDeny: true
    contentTypeNosniff: true
    contentSecurityPolicy: "script-src 'unsafe-inline' https://*.giaufer.fr ;object-src 'none';base-uri 'none'; form-action 'self'; frame-ancestors 'self';"
    permissionsPolicy: "camera=(), microphone=(), geolocation=(), payment=(), usb=();"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: gzip
  namespace: kube-system
spec:
  compress:
    excludedContentTypes:
      - text/event-stream
