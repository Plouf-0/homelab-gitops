apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: whoami-tls
  namespace: whoami
spec:
  secretName: whoami-tls
  dnsNames:
    - test.giaufer.fr
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: whoami
  namespace: whoami
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`test.giaufer.fr`)
      kind: Rule
      middlewares:
        #- name: vpn-only
         # namespace: kube-system
        - name: security-headers
          namespace: kube-system
      services:
        - name: whoami
          port: 80
  tls:
    secretName: whoami-tls
